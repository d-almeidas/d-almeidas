<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Daniel - Aspiring Data Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#484f58"/>
    </linearGradient>
    <filter id="b34" filterUnits="userSpaceOnUse" x="-1200" y="-300" width="3400" height="860"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b28" filterUnits="userSpaceOnUse" x="-1200" y="-300" width="3400" height="860"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="b20" filterUnits="userSpaceOnUse" x="-1200" y="-300" width="3400" height="860"><feGaussianBlur stdDeviation="20"/></filter>
    <!-- fade nas bordas: some para cima, para baixo e para os lados -->
    <linearGradient id="fadeVg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="26%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="72%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeHg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="16%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="84%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeV" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="260">
      <rect width="1000" height="260" fill="url(#fadeVg)"/>
    </mask>
    <mask id="fadeH" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="260">
      <rect width="1000" height="260" fill="url(#fadeHg)"/>
    </mask>
  </defs>
  <g mask="url(#fadeH)"><g mask="url(#fadeV)">

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- névoa: camadas que andam da esquerda para a direita -->
  <g filter="url(#b28)">
    <ellipse cx="-600" cy="70" rx="320" ry="55" fill="#ffffff" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="46s" begin="-8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="150" rx="380" ry="70" fill="#ffffff" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="62s" begin="-35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="210" rx="300" ry="50" fill="#ffffff" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="54s" begin="-20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="110" rx="420" ry="60" fill="#ffffff" opacity="0.1">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="78s" begin="-55s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g filter="url(#b20)">
    <ellipse cx="-600" cy="40" rx="240" ry="38" fill="#ffffff" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="38s" begin="-15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="180" rx="260" ry="42" fill="#ffffff" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="41s" begin="-30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="125" rx="200" ry="32" fill="#ffffff" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="33s" begin="-5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <text x="500" y="128" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700">Daniel</text>
  <text x="500" y="172" text-anchor="middle" fill="#c9d1d9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Aspiring Data Engineer • Python • SQL</text>

  <!-- véu bem leve por cima do texto -->
  <g filter="url(#b34)">
    <ellipse cx="-600" cy="90" rx="450" ry="80" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="90s" begin="-40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-600" cy="200" rx="400" ry="60" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2200 0" dur="70s" begin="-10s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  </g></g>
</svg>
