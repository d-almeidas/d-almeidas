name: Generate snake animation

on:
  # atualiza sozinho a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar na mão (aba Actions > Run workflow)
  workflow_dispatch:
  # roda quando você atualizar o README ou este arquivo
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/add_progress_bar.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#2d333b,#444c56,#636e7b,#8b949e

      - name: Add progress bar
        run: python3 .github/scripts/add_progress_bar.py dist/github-snake-dark.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
